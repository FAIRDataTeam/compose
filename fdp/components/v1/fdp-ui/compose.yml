services:
  fdp-ui:
    image: "fairdata/fairdatapoint-ui:${FDP_UI_VERSION:-latest}"  # todo: pin default when we've reached a stable version
    restart: no
    volumes:
      # override the default runtime config to point to the fdp api on localhost
      - "./config.json:/usr/share/nginx/html/config.json"
    depends_on:
      fdp:
        condition: service_healthy
    healthcheck:
      test: wget --quiet --spider http://127.0.0.1:8080 || exit 1
      interval: 5m
      start_interval: 3s
      start_period: 30s
