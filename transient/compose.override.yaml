services:
  fdp:
    ports:
      # expose on localhost, to enable direct interaction with the api for debugging
      - "127.0.0.1:8080:8080"
  fdp-ui:
    ports:
      # the fdp-ui docker.nginx.conf configures nginx in the fdp-ui container to listen on port 8080
      # we expose it on localhost on port 8001, because port 8000 is already occupied by fdp-client
      # todo: switch to port 8000 when fdp-client is removed
      - "127.0.0.1:8001:8080"
